# wap on Windows (card native-other-platforms): the native wap built there from the seed, as scripts/refresh-seed.sh
# builds it on macOS and Linux, then test/wap/test_native.sh. By hand, or on a push to main.
name: windows
on:
  workflow_dispatch:
  push:
    branches: [main, native-windows]

env:
  # wasm2c from wabt's source at the commit the Mac uses: 1.0.42's writes `u32 u32 var_i0`
  WABT_COMMIT: ce4ebe80
  LLVM_MINGW: 20261104 # clang for Windows (warp's release.yml takes the same)
  WASMTIME: v49.0.2    # the wasmtime command, which runs the seed before a native wap is there (scripts/lib/wap-host.sh)
  # warp's release carries the wasmtime library the native wap links, built for Windows (no Rust here)
  WARP_RELEASE: v1.15.0

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # Git Bash's ln -s a link, as the tests make one, not a copy (the runner may make links)
      MSYS: winsymlinks:nativestrict
    steps:
    # the sources as written, LF: Git for Windows checks text out with CRLF, which bash refuses in the scripts
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v4
    - name: llvm-mingw, wasmtime and warp's wasmtime library
      run: |
        mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
        gh release download "$LLVM_MINGW" --repo mstorsjo/llvm-mingw --pattern "llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
        unzip -q "llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
        echo "$PWD/llvm-mingw-$LLVM_MINGW-ucrt-x86_64/bin" >>"$GITHUB_PATH"
        gh release download "$WASMTIME" --repo bytecodealliance/wasmtime --pattern "wasmtime-$WASMTIME-x86_64-windows.zip"
        unzip -q "wasmtime-$WASMTIME-x86_64-windows.zip"
        echo "$PWD/wasmtime-$WASMTIME-x86_64-windows" >>"$GITHUB_PATH"
        gh release download "$WARP_RELEASE" --repo pannous/warp --pattern "warp-$WARP_RELEASE-x86_64-pc-windows-gnu.zip"
        mkdir -p "$RUNNER_TEMP/native/lib"
        unzip -q -j "warp-$WARP_RELEASE-x86_64-pc-windows-gnu.zip" warp_wasmtime.dll libwarp_wasmtime.dll.a -d "$RUNNER_TEMP/native/lib"
    - uses: actions/cache@v4
      id: wabt
      with:
        path: ${{ runner.temp }}/wabt
        key: wabt-${{ env.WABT_COMMIT }}-windows
    - name: wabt
      if: steps.wabt.outputs.cache-hit != 'true'
      run: |
        git clone -q https://github.com/WebAssembly/wabt "$RUNNER_TEMP/wabt-source" && cd "$RUNNER_TEMP/wabt-source"
        git checkout -q "$WABT_COMMIT" && git submodule update -q --init third_party/picosha2
        cmake -S . -B build -DBUILD_TESTS=OFF -DBUILD_LIBWASM=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/wabt"
        cmake --build build --config Release --parallel
        cmake --install build --config Release
    - run: echo "$RUNNER_TEMP/wabt/bin" >>"$GITHUB_PATH"
    - name: the seed
      # the compiler wap-seed.lock names, with what it reads beside it, where the native wap finds it: wap-seed/
      run: |
        seed="$RUNNER_TEMP/native/wap-seed" && mkdir -p "$seed"
        gh release download "$(cut -d' ' -f1 wap-seed.lock)" --repo pannous/wap --pattern wap.wasm --pattern wap-seed-beside.tar.gz --dir "$seed"
        # (by a name without the drive: tar reads `D:` as a remote host)
        cd "$seed" && tar -xzf wap-seed-beside.tar.gz && rm wap-seed-beside.tar.gz
        # macOS's ._ files, which a seed packed before refresh-seed.sh set COPYFILE_DISABLE holds
        find . -name '._*' -delete
    - name: a wap that runs modules on wasmtime
      # in Git Bash's spelling, /d/a/…, which the modules read (scripts/lib/wap-host.sh); the tests build the tree's
      # compiler from the seed on it, then the tree's native wap (test/wap/compile.sh), which runs every later module
      run: |
        native="$(cygpath -u "$RUNNER_TEMP")/native"
        printf '#!/bin/bash\nsource "%s/scripts/lib/wap-host.sh" && wasmtime_ran "$@"\n' "$PWD" >"$native/wap" && chmod +x "$native/wap"
        # the scripts' content hash, shasum, which Git for Windows lacks, as sha1sum (the same output)
        printf '#!/bin/bash\nexec sha1sum "$@"\n' >"$native/shasum" && chmod +x "$native/shasum"
        # Windows finds warp_wasmtime.dll on the PATH (scripts/lib/wap-beside.sh wap_linked)
        cygpath -w "$native" >>"$GITHUB_PATH" && cygpath -w "$native/lib" >>"$GITHUB_PATH"
    - name: hello
      run: bash test/wap/test_hello.sh
    - name: test_native
      run: bash test/wap/test_native.sh
    - name: probe wap build
      if: failure()
      run: |
        w="$(ls -d data/wap-tests/wap1-*/bin | head -1)/wap"
        printf 'print "Hello"\n' >data/probe.wap
        "$w" build "$PWD/data/probe.wap"; echo "exit $?"; ls data/probe*; data/probe
    - name: the native builds' logs
      if: failure()
      run: find data -name build.log -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
